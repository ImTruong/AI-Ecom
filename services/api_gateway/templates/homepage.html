{% extends 'base.html' %}

{% block title %}TruongShop - Your Online Shopping Destination{% endblock %}

{% block extra_css %}
<style>
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        margin-top: 30px;
    }

    .product-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
    }

    .product-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .product-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 60px;
    }

    .product-info {
        padding: 20px;
    }

    .product-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #333;
    }

    .product-description {
        font-size: 14px;
        color: #666;
        margin-bottom: 15px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .product-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
    }

    .product-price {
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
    }

    .btn-add-cart {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.2s;
    }

    .btn-add-cart:hover {
        transform: scale(1.05);
    }

    .btn-add-cart:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .product-meta {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
    }

    .meta-tag {
        background: #f0f0f0;
        padding: 5px 10px;
        border-radius: 10px;
        font-size: 12px;
        color: #666;
    }

    .stock-status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
    }

    .in-stock {
        background: #d4edda;
        color: #155724;
    }

    .out-of-stock {
        background: #f8d7da;
        color: #721c24;
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }

    .empty-state-icon {
        font-size: 80px;
        margin-bottom: 20px;
    }

    .empty-state-text {
        font-size: 20px;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<!-- Search Bar -->
<div class="search-container">
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search for books, clothes, and more...">
        <button onclick="searchProducts()" class="btn-search">Search</button>
    </div>
</div>

<!-- Category Tabs -->
<div class="tabs">
    <button class="tab active" data-category="all" onclick="filterByCategory('all')">All Products</button>
    <button class="tab" data-category="book" onclick="filterByCategory('book')">📚 Books</button>
    <button class="tab" data-category="clothes" onclick="filterByCategory('clothes')">👕 Clothes</button>
</div>

<!-- Recommended Section -->
<div id="recommendationSection" style="display: none; margin-bottom: 50px;">
    <h2 style="font-weight: 900; font-size: 28px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">✨ Recommended for You</h2>
    <div id="recommendationGrid" class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;"></div>
    <hr style="margin-top: 50px; border: 0; border-top: 1px solid #eee;">
</div>

<!-- Products Grid -->
<div id="productsContainer">
    <div class="spinner"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentCategory = 'all';
    let allProducts = [];
    let ratingsData = [];

    async function loadProducts() {
        try {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '<div class="spinner"></div>';

            // Load products and ratings in parallel
            const [productsResponse, ratingsResponse] = await Promise.all([
                fetch('/api/products/').catch(() => ({ ok: false })),
                fetch('/api/ratings/list/').catch(() => ({ ok: false }))
            ]);

            let products = [];
            if (productsResponse.ok) {
                const data = await productsResponse.json();
                products = data.map(p => ({
                    ...p,
                    type: p.product_type, // 'book', 'clothes'
                    title: p.name,
                    icon: p.product_type === 'book' ? '📚' : '👕'
                }));
            }

            if (ratingsResponse.ok) {
                const rData = await ratingsResponse.json();
                if (rData.success) ratingsData = rData.data;
            }

            allProducts = products;
            displayProducts(products);
            
            if (isLoggedIn()) {
                loadRecommendations();
            }
        } catch (error) {
            console.error('Error loading products:', error);
            const container = document.getElementById('productsContainer');
            if (container) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-text">Error loading products</div>
                    </div>
                `;
            }
        }
    }

    function getAverageRatingForGroup(productTitle, productType) {
        // Find all ratings that match this product name/title + type
        // The Rating logic stores product_name which is Title
        const matchRatings = ratingsData.filter(r => r.product_name === productTitle && r.product_type === productType);
        if (matchRatings.length === 0) return { avg: 0, count: 0 };
        
        const sum = matchRatings.reduce((s, r) => s + r.stars, 0);
        return {
            avg: (sum / matchRatings.length).toFixed(1),
            count: matchRatings.length
        };
    }

    function displayProducts(products) {
        const container = document.getElementById('productsContainer');
        if (products.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🛍️</div><div class="empty-state-text">No products found</div></div>`;
            return;
        }
        container.innerHTML = `<div class="product-grid">${products.map(product => createProductCard(product)).join('')}</div>`;
    }

    function createProductCard(product) {
        const totalStock = product.variants.reduce((sum, v) => sum + parseInt(v.stock), 0);
        const inStock = totalStock > 0;
        const stockClass = inStock ? 'in-stock' : 'out-of-stock';
        const stockText = inStock ? 'In Stock' : 'Out of Stock';

        // Fix: Use image_url if provided, else fallback to icon
        const imageHtml = product.image_url 
            ? `<img src="${product.image_url}" alt="${product.title}" style="width: 100%; height: 100%; object-fit: cover;">`
            : product.icon;

        const { avg, count } = getAverageRatingForGroup(product.title, product.type);
        const starHTML = count > 0 
            ? `<div style="color: #ffbe76; font-size: 14px; font-weight: 700; margin-bottom: 5px;">★ ${avg} <span style="color: #999; font-weight: 400;">(${count})</span></div>`
            : `<div style="color: #ddd; font-size: 14px; margin-bottom: 5px;">☆ No ratings</div>`;

        let metadata = '';
        if (product.type === 'book') {
            const author = product.attributes.author || 'Unknown';
            metadata = `
                <div class="product-meta">
                    <span class="meta-tag">📝 ${author}</span>
                    <span class="meta-tag">📚 ${product.category}</span>
                </div>
            `;
        } else {
            const variantCount = product.variants.length;
            metadata = `
                <div class="product-meta">
                    <span class="meta-tag">${variantCount} Variations</span>
                    <span class="meta-tag">👕 ${product.category}</span>
                </div>
            `;
        }

        return `
            <div class="product-card" onclick="window.location.href='/product/detail/${product.id}/'">
                <div class="product-image">${imageHtml}</div>
                <div class="product-info">
                    <div class="product-title">${product.title}</div>
                    ${starHTML}
                    <div class="product-description">${product.description}</div>
                    ${metadata}
                    <div class="product-footer">
                        <div class="product-price">$${product.price}</div>
                        <div style="display: flex; gap: 8px;">
                            <a href="/product/detail/${product.id}/" class="btn btn-primary" style="padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 700; background: #1a1a1a;">View Detail</a>
                        </div>
                    </div>
                    <span class="stock-status ${stockClass}">${stockText} (${totalStock})</span>
                </div>
            </div>
        `;
    }

    async function addToCart(productType, productId, price) {
        if (!isLoggedIn()) {
            showAlert('Please login to add items to cart', 'error');
            setTimeout(() => window.location.href = '/login/', 1500);
            return;
        }

        try {
            // Tracking: Log add to cart
            fetch('/api/tracking/log-cart/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    product_id: productId,
                    product_type: productType,
                    action_type: 'add',
                    quantity: 1,
                    price: price,
                    customer_id: localStorage.getItem('userId')
                })
            }).catch(e => console.warn('Tracking error:', e));

            const response = await fetch('/api/cart/add/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getToken()}`
                },
                body: JSON.stringify({
                    product_type: productType,
                    product_id: productId,
                    product_name: allProducts.find(p => p.id == productId).name,
                    image_url: allProducts.find(p => p.id == productId).image_url,
                    price: price,
                    quantity: 1
                })
            });

            const data = await response.json();

            if (data.success) {
                showAlert('Item added to cart!', 'success');
                updateCartBadge();
            } else {
                showAlert(data.error || 'Failed to add item to cart', 'error');
            }
        } catch (error) {
            console.error('Error adding to cart:', error);
            showAlert('Error adding item to cart', 'error');
        }
    }

    function filterByCategory(category) {
        currentCategory = category;

        // Update active tab
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelector(`[data-category="${category}"]`).classList.add('active');

        // Filter products
        let filtered = allProducts;
        if (category !== 'all') {
            filtered = allProducts.filter(p => p.type === category);
        }

        displayProducts(filtered);
    }

    async function loadRecommendations() {
        const userId = localStorage.getItem('userId');
        const section = document.getElementById('recommendationSection');
        const grid = document.getElementById('recommendationGrid');
        
        if (!userId) return;

        try {
            // recommendation-service is on 8101
            const resp = await fetch(`http://localhost:8101/api/recommendations/${userId}`);
            if (!resp.ok) return;
            
            const res = await resp.json();
            if (res.success && res.recommendations.length > 0) {
                // Map the results back to our standard product objects
                const recommendedProducts = res.recommendations.map(r => {
                    const base = allProducts.find(p => p.id == r.id);
                    if (base) return base;
                    // Fallback to payload data if not in current list
                    return {
                        id: r.id,
                        name: r.payload.name,
                        title: r.payload.name,
                        product_type: r.payload.product_type,
                        type: r.payload.product_type,
                        category: r.payload.category,
                        image_url: r.payload.image_url,
                        description: r.payload.raw_text.substring(0, 100) + '...',
                        price: '?', 
                        variants: [],
                        icon: r.payload.product_type === 'book' ? '📚' : '👕'
                    };
                }).filter(p => p);

                if (recommendedProducts.length > 0) {
                    grid.innerHTML = recommendedProducts.map(p => createProductCard(p)).join('');
                    section.style.display = 'block';
                }
            }
        } catch (e) {
            console.warn('Recommendation service not available', e);
        }
    }

    function searchProducts() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        // Tracking: Log search query
        if (query) {
            fetch('/api/tracking/log-search/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: query,
                    customer_id: localStorage.getItem('userId')
                })
            }).catch(e => console.warn('Tracking error:', e));
        }

        if (!query) {
            displayProducts(allProducts);
            return;
        }

        const filtered = allProducts.filter(p => {
            const nameMatch = p.name ? p.name.toLowerCase().includes(query) : false;
            const descMatch = p.description ? p.description.toLowerCase().includes(query) : false;
            const catMatch = p.category ? p.category.toLowerCase().includes(query) : false;
            return nameMatch || descMatch || catMatch;
        });

        displayProducts(filtered);
    }

    // Allow search on Enter key
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        loadProducts();
    });
</script>
{% endblock %}
