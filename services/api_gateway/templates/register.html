{% extends 'base.html' %}

{% block title %}Register - TruongShop{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 450px;
        margin: 50px auto;
    }

    .auth-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .auth-title {
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
    }

    .form-input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s;
    }

    .form-input:focus {
        outline: none;
        border-color: #667eea;
    }

    .btn-submit {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
        margin-top: 10px;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .auth-footer {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .auth-footer a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    .password-hint {
        font-size: 12px;
        color: #999;
        margin-top: 5px;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">📝 Register</h1>
        
        <form id="registerForm" onsubmit="register(event)">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="full_name" class="form-input" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required placeholder="Enter your password">
                <div class="password-hint">At least 8 characters</div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" class="form-input" required placeholder="Confirm your password">
            </div>

            <div class="form-group">
                <label class="form-label">Phone (Optional)</label>
                <input type="tel" id="phone" class="form-input" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label class="form-label">Address (Optional)</label>
                <textarea id="address" class="form-input" rows="3" placeholder="Enter your address"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login/">Login here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Redirect if already logged in
    if (isLoggedIn()) {
        window.location.href = '/';
    }

    async function register(event) {
        event.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (password !== confirmPassword) {
            showAlert('Passwords do not match', 'error');
            return;
        }

        if (password.length < 8) {
            showAlert('Password must be at least 8 characters', 'error');
            return;
        }

        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Registering...';

        try {
            const response = await fetch('/api/auth/customer/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: password,
                    full_name: document.getElementById('full_name').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value
                })
            });

            const data = await response.json();

            if (data.success) {
                setToken(data.data.access_token);
                localStorage.setItem('user_role', 'customer');
                if (data.data.user && data.data.user.id !== undefined) {
                    localStorage.setItem('user_id', data.data.user.id);
                }
                showAlert('Registration successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/', 1500);
            } else {
                showAlert(data.error || 'Registration failed', 'error');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Register';
            }
        } catch (error) {
            console.error('Error during registration:', error);
            showAlert('Error during registration', 'error');
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Register';
        }
    }
</script>
{% endblock %}
