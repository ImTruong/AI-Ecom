{% extends 'base.html' %}

{% block title %}Your Shopping Bag - TruongShop{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="display-5 fw-bold text-dark"><i class="fa fa-shopping-bag me-3 text-primary"></i>Shopping Bag</h1>
        <p class="text-muted">Review your items and proceed to a secure checkout.</p>
    </div>
</div>

<div id="cart-root">
    <!-- Dynamic content -->
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
</div>

<script>
    async function fetchCart() {
        const token = localStorage.getItem('access_token');
        if(!token) {
            renderEmpty("Please login to view your cart.", "/login/", "Login Now");
            return;
        }

        try {
            const res = await fetch('/api/cart/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            
            if(data.success) {
                renderCart(data.data);
            } else {
                renderEmpty("Your bag is feeling light...");
            }
        } catch (e) {
            renderEmpty("Failed to connect to cart service.");
        }
    }

    function renderEmpty(msg, link="/", label="Start Shopping") {
        document.getElementById('cart-root').innerHTML = `
            <div class="glass-card p-5 text-center bg-white shadow-sm">
                <div class="mb-4" style="font-size: 5rem;">🛍️</div>
                <h3 class="fw-bold text-dark mb-3">${msg}</h3>
                <a href="${link}" class="btn btn-vibrant px-5 py-3 rounded-pill fs-5 shadow">${label}</a>
            </div>
        `;
    }

    function renderCart(cart) {
        if(!cart.items || cart.items.length === 0) {
            renderEmpty("Your bag is currently empty.");
            return;
        }

        let html = `
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="d-flex flex-column gap-3">
                        ${cart.items.map(item => `
                            <div class="glass-card p-0 overflow-hidden bg-white border-0 shadow-sm hover-lift">
                                <div class="row g-0 align-items-center">
                                    <div class="col-3 col-md-2 bg-light p-3 text-center">
                                        <div style="height: 80px; display: flex; align-items: center; justify-content: center;">
                                            <img src="${item.image_url || 'https://via.placeholder.com/100'}" class="img-fluid rounded" style="max-height: 100%; object-fit: contain;">
                                        </div>
                                    </div>
                                    <div class="col-9 col-md-10 p-4">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <h5 class="fw-bold mb-1 text-dark">${item.product_name || (item.product_type + ' #' + item.product_id)}</h5>
                                                <p class="small text-muted mb-0"><i class="fa fa-tag me-1"></i>${item.product_type.toUpperCase()}</p>
                                            </div>
                                            <button class="btn btn-link text-danger p-0" onclick="handleRemove('${item.product_type}', ${item.product_id})">
                                                <i class="fa fa-trash-can shadow-none"></i>
                                            </button>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center mt-3">
                                            <div class="btn-group border rounded-pill p-1 bg-light">
                                                <button class="btn btn-sm btn-link text-dark text-decoration-none px-2" onclick="handleQty('${item.product_type}', ${item.product_id}, ${item.quantity - 1})"><i class="fa fa-minus"></i></button>
                                                <span class="px-2 fw-bold" style="min-width: 30px; text-align: center;">${item.quantity}</span>
                                                <button class="btn btn-sm btn-link text-dark text-decoration-none px-2" onclick="handleQty('${item.product_type}', ${item.product_id}, ${item.quantity + 1})"><i class="fa fa-plus"></i></button>
                                            </div>
                                            <div class="text-end">
                                                <p class="mb-0 text-muted small">Unit: ${new Intl.NumberFormat('vi-VN').format(item.price)}đ</p>
                                                <p class="mb-0 fw-bold text-primary fs-5">${new Intl.NumberFormat('vi-VN').format(item.subtotal)}đ</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="glass-card p-4 bg-white border-0 shadow sticky-top" style="top: 100px;">
                        <h4 class="fw-bold mb-4 text-dark border-bottom pb-3">Order Summary</h4>
                        <div class="d-flex justify-content-between mb-3 fs-5">
                            <span class="text-muted">Subtotal</span>
                            <span class="fw-bold">${new Intl.NumberFormat('vi-VN').format(cart.total)}đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 fs-5">
                            <span class="text-muted">Shipping</span>
                            <span class="text-success fw-bold">FREE</span>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between mb-4 fs-4">
                            <span class="fw-bold text-dark">Total</span>
                            <span class="fw-extrabold text-primary">${new Intl.NumberFormat('vi-VN').format(cart.total)}đ</span>
                        </div>
                        <button class="btn btn-vibrant w-100 py-3 rounded-pill fs-5 shadow mb-3" onclick="window.location.href='/checkout/'">
                            Checkout Now <i class="fa fa-arrow-right ms-2"></i>
                        </button>
                        <button class="btn btn-outline-danger w-100 py-2 rounded-pill border-0" onclick="handleClear()">
                            Clear All Items
                        </button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('cart-root').innerHTML = html;
    }

    async function handleQty(type, id, q) {
        if(q < 1) return;
        const token = localStorage.getItem('access_token');
        try {
            const res = await fetch('/api/cart/update/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ product_type: type, product_id: id, quantity: q })
            });
            const back = await res.json();
            if(back.success) {
                renderCart(back.data);
                refreshCartBadge();
            }
        } catch (e) { showAlert("Update failed", "danger"); }
    }

    async function handleRemove(type, id) {
        const token = localStorage.getItem('access_token');
        try {
            const res = await fetch(`/api/cart/remove/${type}/${id}/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const back = await res.json();
            if(back.success) {
                renderCart(back.data);
                refreshCartBadge();
                showAlert("Item removed");
            }
        } catch (e) { showAlert("Remove failed", "danger"); }
    }

    async function handleClear() {
        if(!confirm("Are you sure you want to clear your cart?")) return;
        const token = localStorage.getItem('access_token');
        try {
            const res = await fetch('/api/cart/clear/', {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const back = await res.json();
            if(back.success) {
                renderCart(back.data);
                refreshCartBadge();
                showAlert("Cart cleared");
            }
        } catch (e) { showAlert("Clear failed", "danger"); }
    }

    fetchCart();
</script>

<style>
    .fw-extrabold { font-weight: 800; }
    .hover-lift { transition: transform 0.3s; }
    .hover-lift:hover { transform: translateY(-3px); }
</style>
{% endblock %}
