{% extends 'base.html' %}

{% block title %}Manage Products - Staff Dashboard{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-boxes me-2"></i>Product Management</h2>
        <button class="btn btn-primary rounded-pill px-4" onclick="openAddModal()">
            <i class="fas fa-plus me-2"></i>Add New Product
        </button>
    </div>

    <!-- Product List -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Product</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Price</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="modalTitle">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="productForm">
                    <input type="hidden" id="edit-id">
                    
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="form-name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="form-category" required onchange="onCategoryChange()">
                                <!-- Categories loaded here -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Price (VND)</label>
                            <input type="number" class="form-control" id="form-price" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Image URL</label>
                            <input type="text" class="form-control" id="form-image">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="form-description" rows="3"></textarea>
                        </div>

                        <!-- Dynamic Attributes Section -->
                        <div class="col-12 mt-4">
                            <div class="card bg-light border-0 p-3 rounded-3">
                                <h6 class="fw-bold mb-3"><i class="fas fa-tags me-2"></i>Specific Attributes</h6>
                                <div class="row g-3" id="dynamic-fields">
                                    <div class="col-12 text-muted small italic">Select a category to see specific fields.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary px-4" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
</div>

<script>
    let categories = [];
    const CATEGORY_ATTRS = {
        'books': [
            { name: 'author', label: 'Author', type: 'text' },
            { name: 'isbn', label: 'ISBN', type: 'text' },
            { name: 'publisher', label: 'Publisher', type: 'text' },
            { name: 'page_count', label: 'Pages', type: 'number' }
        ],
        'clothes': [
            { name: 'brand', label: 'Brand', type: 'text' },
            { name: 'material', label: 'Material', type: 'text' },
            { name: 'gender', label: 'Gender', type: 'select', options: ['Men', 'Women', 'Unisex'] }
        ],
        'laptops': [
            { name: 'cpu', label: 'CPU', type: 'text' },
            { name: 'ram', label: 'RAM (GB)', type: 'number' },
            { name: 'storage', label: 'Storage', type: 'text' },
            { name: 'gpu', label: 'GPU', type: 'text' }
        ],
        'phones': [
            { name: 'screen_size', label: 'Screen Size', type: 'text' },
            { name: 'battery', label: 'Battery (mAh)', type: 'number' },
            { name: 'camera_specs', label: 'Camera Specs', type: 'text' }
        ],
        'tablets': [
            { name: 'screen_size', label: 'Screen Size', type: 'text' },
            { name: 'os', label: 'OS', type: 'text' },
            { name: 'is_stylus_supported', label: 'Stylus Supported', type: 'checkbox' }
        ],
        'cameras': [
            { name: 'resolution', label: 'Resolution', type: 'text' },
            { name: 'sensor_type', label: 'Sensor Type', type: 'text' },
            { name: 'lens_included', label: 'Lens Included', type: 'text' }
        ],
        'headphones': [
            { name: 'type', label: 'Type', type: 'select', options: ['Over-ear', 'In-ear', 'On-ear'] },
            { name: 'is_wireless', label: 'Wireless', type: 'checkbox' },
            { name: 'noise_cancelling', label: 'Noise Cancelling', type: 'checkbox' }
        ],
        'watches': [
            { name: 'style', label: 'Style', type: 'select', options: ['Analog', 'Digital', 'Smart'] },
            { name: 'water_resistance', label: 'Water', type: 'text' },
            { name: 'band_material', label: 'Band', type: 'text' }
        ],
        'shoes': [
            { name: 'size_eu', label: 'Size (EU)', type: 'number' },
            { name: 'material', label: 'Material', type: 'text' },
            { name: 'shoe_type', label: 'Type', type: 'text' }
        ],
        'furniture': [
            { name: 'material', label: 'Material', type: 'text' },
            { name: 'dimensions', label: 'Dimensions', type: 'text' },
            { name: 'weight_capacity', label: 'Weight Cap', type: 'text' }
        ]
    };

    async function init() {
        await loadCategories();
        await loadProducts();
    }

    async function loadCategories() {
        const resp = await fetch('/api/products/categories/');
        categories = await resp.json();
        const select = document.getElementById('form-category');
        select.innerHTML = '<option value="">Select Category</option>';
        categories.forEach(c => {
            select.innerHTML += `<option value="${c.id}" data-slug="${c.slug}">${c.name}</option>`;
        });
    }

    async function loadProducts() {
        const resp = await fetch('/api/products/');
        const products = await resp.json();
        const list = document.getElementById('product-list');
        list.innerHTML = '';
        
        products.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="ps-4">
                    <div class="d-flex align-items-center">
                        <img src="${p.image_url || 'https://via.placeholder.com/50'}" class="rounded me-3" width="40" height="40" style="object-fit: contain;">
                        <div>
                            <div class="fw-bold">${p.name}</div>
                            <div class="text-muted small">ID: ${p.id}</div>
                        </div>
                    </div>
                </td>
                <td>${p.category}</td>
                <td><span class="badge bg-light text-dark border">${p.product_type}</span></td>
                <td class="fw-bold text-primary">${new Intl.NumberFormat('vi-VN').format(p.price)}</td>
                <td class="text-end pe-4">
                    <button class="btn btn-sm btn-outline-primary me-2" onclick="openEditModal(${p.id})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                </td>
            `;
            list.appendChild(tr);
        });
    }

    function onCategoryChange() {
        const select = document.getElementById('form-category');
        const slug = select.options[select.selectedIndex].dataset.slug;
        renderDynamicFields(slug);
    }

    function renderDynamicFields(slug, values = {}) {
        const container = document.getElementById('dynamic-fields');
        container.innerHTML = '';
        
        const attrs = CATEGORY_ATTRS[slug];
        if (!attrs) {
            container.innerHTML = '<div class="col-12 text-muted small italic">Select a category to see specific fields.</div>';
            return;
        }

        attrs.forEach(attr => {
            const col = document.createElement('div');
            col.className = 'col-md-6';
            let inputNode = '';
            
            if (attr.type === 'select') {
                inputNode = `<select class="form-select dyn-attr" name="${attr.name}">
                    ${attr.options.map(opt => `<option value="${opt}" ${values[attr.name] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>`;
            } else if (attr.type === 'checkbox') {
                inputNode = `<div class="form-check mt-2">
                    <input class="form-check-input dyn-attr" type="checkbox" name="${attr.name}" ${values[attr.name] ? 'checked' : ''}>
                    <label class="form-check-label">Yes</label>
                </div>`;
            } else {
                inputNode = `<input type="${attr.type}" class="form-control dyn-attr" name="${attr.name}" value="${values[attr.name] || ''}">`;
            }

            col.innerHTML = `
                <label class="form-label small">${attr.label}</label>
                ${inputNode}
            `;
            container.appendChild(col);
        });
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Add Product';
        document.getElementById('edit-id').value = '';
        document.getElementById('productForm').reset();
        document.getElementById('dynamic-fields').innerHTML = '<div class="col-12 text-muted small italic">Select a category to see specific fields.</div>';
        new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    async function openEditModal(id) {
        document.getElementById('modalTitle').textContent = 'Edit Product';
        const resp = await fetch(`/api/products/${id}/`);
        const p = await resp.json();
        
        document.getElementById('edit-id').value = p.id;
        document.getElementById('form-name').value = p.name;
        document.getElementById('form-description').value = p.description;
        document.getElementById('form-price').value = p.price;
        document.getElementById('form-image').value = p.image_url;
        
        const catSelect = document.getElementById('form-category');
        catSelect.value = p.category_id;
        
        const slug = catSelect.options[catSelect.selectedIndex].dataset.slug;
        renderDynamicFields(slug, p);
        
        new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    async function saveProduct() {
        const id = document.getElementById('edit-id').value;
        const select = document.getElementById('form-category');
        const category_id = select.value;
        const product_type = select.options[select.selectedIndex].dataset.slug.replace(/s$/, ''); // singularize (laptops -> laptop)
        
        const payload = {
            id: id || null,
            name: document.getElementById('form-name').value,
            category_id: parseInt(category_id),
            product_type: product_type === 'clothe' ? 'clothes' : product_type, // Special case for clothes
            price: parseFloat(document.getElementById('form-price').value),
            description: document.getElementById('form-description').value,
            image_url: document.getElementById('form-image').value,
            supplier_id: 1 // mock
        };

        // Add dynamic attributes
        document.querySelectorAll('.dyn-attr').forEach(input => {
            if (input.type === 'checkbox') {
                payload[input.name] = input.checked;
            } else {
                payload[input.name] = input.value;
            }
        });

        const resp = await fetch('/api/products/manage/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify(payload)
        });

        const res = await resp.json();
        if (res.success) {
            bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
            loadProducts();
        } else {
            alert('Error: ' + res.error);
        }
    }

    async function deleteProduct(id) {
        if (!confirm('Are you sure you want to delete this product?')) return;
        const resp = await fetch(`/api/products/manage/${id}/`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if ((await resp.json()).success) loadProducts();
    }

    init();
</script>
{% endblock %}
