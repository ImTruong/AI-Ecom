{% extends 'base.html' %}

{% block title %}{{ product_id }} - TruongShop Detail{% endblock %}

{% block content %}
<div class="row g-5">
    <div class="col-lg-6">
        <div class="glass-card p-0 overflow-hidden border-0 sticky-top" style="top: 100px;">
            <div class="bg-white p-5 text-center shadow-inner" style="min-height: 500px; display: flex; align-items: center; justify-content: center;">
                <img id="product-img" src="" class="img-fluid hover-zoom" alt="Product" style="max-height: 400px; object-fit: contain;">
                <div class="position-absolute top-0 start-0 m-4">
                    <span class="badge bg-primary rounded-pill px-4 py-2 fs-6 shadow" id="type-badge">Type</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-6">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Explore</a></li>
                <li class="breadcrumb-item active" id="breadcrumb-cat">Category</li>
            </ol>
        </nav>

        <h1 class="display-4 fw-bold text-dark mb-2" id="title">Loading...</h1>
        <div class="d-flex align-items-center gap-3 mb-4">
            <span class="fs-2 fw-bold text-primary" id="price">...</span>
            <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3">In Stock</span>
        </div>

        <p class="text-muted fs-5 mb-5 lh-lg" id="desc">...</p>

        <div class="glass-card p-4 mb-5 bg-white border">
            <h5 class="fw-bold mb-4 text-dark border-bottom pb-3"><i class="fa fa-microchip me-2 text-primary"></i>Technical Specifications</h5>
            <div class="row g-4" id="specs">
                <!-- Specs injected here -->
            </div>
        </div>

        <div class="d-flex gap-3 align-items-center">
            <div class="btn-group border rounded-pill p-1 bg-white shadow-sm" style="width: 140px;">
                <button class="btn btn-link text-dark text-decoration-none px-3" onclick="stepQty(-1)"><i class="fa fa-minus"></i></button>
                <input type="number" id="qty" class="form-control border-0 text-center bg-transparent fw-bold" value="1" min="1" readonly>
                <button class="btn btn-link text-dark text-decoration-none px-3" onclick="stepQty(1)"><i class="fa fa-plus"></i></button>
            </div>
            <button class="btn btn-vibrant btn-lg flex-grow-1 shadow" onclick="handleAddToCart()">
                <i class="fa fa-shopping-cart me-2"></i>Add to Shopping Bag
            </button>
        </div>
    </div>
</div>

<script>
    const pId = "{{ product_id }}";
    let pData = null;
    const BLACKLIST = ['id', 'name', 'description', 'price', 'image_url', 'category', 'category_id', 'product_type', 'created_at', 'updated_at', 'supplier_id'];

    async function fetchData() {
        try {
            const res = await fetch(`/api/products/${pId}/`);
            if(!res.ok) throw new Error("Not found");
            pData = await res.json();

            document.getElementById('title').textContent = pData.name;
            document.getElementById('desc').textContent = pData.description;
            document.getElementById('price').textContent = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(pData.price);
            document.getElementById('product-img').src = pData.image_url || 'https://via.placeholder.com/600x600?text=' + pData.name;
            document.getElementById('breadcrumb-cat').textContent = pData.category;
            document.getElementById('type-badge').textContent = pData.product_type.toUpperCase();

            const specs = document.getElementById('specs');
            Object.keys(pData).forEach(k => {
                if(!BLACKLIST.includes(k) && pData[k]) {
                    const div = document.createElement('div');
                    div.className = 'col-6';
                    div.innerHTML = `<p class="mb-0 text-muted small text-uppercase fw-bold">${k.replace(/_/g, ' ')}</p><p class="mb-0 fw-bold text-dark">${pData[k]}</p>`;
                    specs.appendChild(div);
                }
            });

            // AI tracking: log-view
            logTracking('log-view', { product_id: pId, product_type: pData.product_type });
            
            // Trigger AI Chatbot (Silently record to Graph)
            triggerAI('view', '', pId);

        } catch (e) {
            showAlert("Error loading product", "danger");
            window.location.href = "/";
        }
    }

    async function logTracking(endpoint, data) {
        const userId = localStorage.getItem('user_id');
        try {
            // Background call: don't wait for response
            fetch(`/api/tracking/${endpoint}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...data, customer_id: userId })
            }).catch(e => console.warn("Tracking failed:", e));
        } catch(e) {}
    }

    function stepQty(n) {
        const input = document.getElementById('qty');
        let val = parseInt(input.value) + n;
        if(val < 1) val = 1;
        input.value = val;
    }

    async function handleAddToCart() {
        const token = localStorage.getItem('access_token');
        if(!token) {
            showAlert("Please login first", "warning");
            setTimeout(() => window.location.href = '/login/', 1500);
            return;
        }

        const qty = parseInt(document.getElementById('qty').value);
        try {
            const res = await fetch('/api/cart/add/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ 
                    product_type: pData.product_type, 
                    product_id: pId, 
                    quantity: qty,
                    price: pData.price,
                    product_name: pData.name,
                    image_url: pData.image_url
                })
            });
            const back = await res.json();
            if(back.success) {
                showAlert(`Successfully added ${qty} item(s) to cart!`, "success");
                refreshCartBadge();
                
                // Trigger AI Chatbot with product context
                triggerAI('cart', '', pId);

                // AI tracking: log-cart
                logTracking('log-cart', {
                    product_id: pId,
                    product_type: pData.product_type,
                    action_type: 'add',
                    price: pData.price,
                    quantity: qty
                });
            } else {
                showAlert(back.message || "Failed to add", "danger");
            }
        } catch (e) {
            showAlert("Service communication error", "danger");
        }
    }

    fetchData();
</script>

<style>
    .hover-zoom { transition: transform 0.3s; }
    .hover-zoom:hover { transform: scale(1.05); }
    .shadow-inner { box-shadow: inset 0 0 20px rgba(0,0,0,0.02); }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
{% endblock %}
