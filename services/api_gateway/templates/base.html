<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TruongShop - Enterprise AI E-commerce{% endblock %}</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --vibrant-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dark-surface: #1a1a1a;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7fe;
            min-height: 100vh;
        }
        .navbar-custom {
            background: var(--vibrant-gradient);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -1px;
        }
        .search-wrapper {
            position: relative;
            max-width: 500px;
            width: 100%;
        }
        .search-input {
            border-radius: 50px;
            padding: 10px 25px;
            padding-right: 50px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .search-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #667eea;
        }
        .cart-icon-wrapper {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .cart-icon-wrapper:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .badge-cart {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.7rem;
        }
        .footer {
            background: var(--dark-surface);
            color: #888;
            padding: 3rem 0;
            margin-top: 5rem;
        }
        /* Custom Components */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }
        .btn-vibrant {
            background: var(--vibrant-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-vibrant:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
            color: white;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🛍️ TruongShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <div class="mx-auto search-wrapper my-3 my-lg-0">
                    <form action="/search/" method="GET" class="d-flex">
                        <input type="text" name="q" class="form-control search-input" placeholder="Search for anything...">
                        <button type="submit" class="search-btn"><i class="fa fa-search"></i></button>
                    </form>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="cart-icon-wrapper" id="cartToggle" onclick="window.location.href='/cart/'">
                        <i class="fa fa-shopping-bag fs-4 text-white"></i>
                        <span class="badge rounded-pill bg-danger badge-cart" id="cartBadge">0</span>
                    </div>
                    <div class="dropdown" id="userMenu">
                        <!-- Loaded via JS -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div id="alertPlaceholder"></div>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer text-center">
        <div class="container">
            <p class="mb-1 fw-bold text-white">TruongShop Enterprise</p>
            <p class="small">&copy; 2024 AI-Driven Microservices Architecture. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const TYPE_ICONS = {
            'laptop': 'laptop', 'phone': 'mobile-screen', 'book': 'book',
            'clothes': 'shirt', 'watch': 'watch', 'camera': 'camera',
            'shoe': 'shoe-prints', 'furniture': 'couch', 'tablet': 'tablet-screen-button',
            'headphone': 'headphones'
        };

        function showAlert(msg, type='success') {
            const wrapper = document.getElementById('alertPlaceholder');
            wrapper.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show rounded-4 shadow-sm" role="alert">
                ${msg} <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            setTimeout(() => {
                const alert = bootstrap.Alert.getOrCreateInstance(wrapper.querySelector('.alert'));
                if(alert) alert.close();
            }, 3000);
        }

        function getToken() { return localStorage.getItem('access_token'); }
        function setToken(t) { localStorage.setItem('access_token', t); }
        function clearToken() { localStorage.removeItem('access_token'); }
        function isLoggedIn() { return !!getToken(); }

        function updateUI() {
            const userMenu = document.getElementById('userMenu');
            const token = localStorage.getItem('access_token');
            const role = localStorage.getItem('user_role');

            if (token && role) {
                userMenu.innerHTML = `
                    <button class="btn btn-outline-light rounded-pill px-4 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fa fa-user-circle me-2"></i>Account
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 mt-3">
                        <li><h6 class="dropdown-header text-uppercase small fw-bold">${role} Mode</h6></li>
                        ${role === 'staff' ? `
                            <li><a class="dropdown-item py-2" href="/staff/dashboard/"><i class="fa fa-chart-line me-2"></i>Dashboard</a></li>
                            <li><a class="dropdown-item py-2" href="/staff/products/"><i class="fa fa-box-open me-2"></i>Products</a></li>
                        ` : `
                            <li><a class="dropdown-item py-2" href="/profile/"><i class="fa fa-user me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item py-2" href="/orders/"><i class="fa fa-history me-2"></i>My Orders</a></li>
                        `}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="#" onclick="logout()"><i class="fa fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                `;
            } else {
                userMenu.innerHTML = `<a href="/login/" class="btn btn-outline-light rounded-pill px-4">Login</a>`;
            }
        }

        async function refreshCartBadge() {
            const token = localStorage.getItem('access_token');
            if (!token) return;
            try {
                const res = await fetch('/api/cart/', {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('cartBadge').textContent = data.data.items.length;
                }
            } catch (e) { console.error(e); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login/';
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
            refreshCartBadge();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
