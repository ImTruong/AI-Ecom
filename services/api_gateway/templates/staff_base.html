<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TruongShop Staff Portal{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --staff-gradient: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            --staff-accent: #7c3aed;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7fe;
            min-height: 100vh;
        }
        .navbar-staff {
            background: var(--staff-gradient);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -1px;
        }
        .nav-link {
            font-weight: 600;
        }
        .nav-link.active {
            color: #fff !important;
            text-decoration: underline;
        }
        .btn-logout {
            border-radius: 12px;
            font-weight: 700;
            border-color: #ef4444;
            color: #ef4444;
        }
        .btn-logout:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-staff sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/staff/dashboard/">🧑‍💼 Staff Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#staffNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="staffNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/staff/dashboard/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/orders/">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/products/">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/suppliers/">Suppliers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/staff/users/">Users</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    {% block staff_nav_extra %}{% endblock %}
                    <a href="/" class="btn btn-outline-light rounded-pill px-3">Shop Front</a>
                    <button class="btn btn-outline-light btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div id="alertPlaceholder"></div>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showAlert(msg, type='success') {
            const wrapper = document.getElementById('alertPlaceholder');
            wrapper.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show rounded-4 shadow-sm" role="alert">
                ${msg} <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            setTimeout(() => {
                const alert = bootstrap.Alert.getOrCreateInstance(wrapper.querySelector('.alert'));
                if (alert) alert.close();
            }, 3000);
        }

        function getToken() { return localStorage.getItem('access_token'); }
        function setToken(t) { localStorage.setItem('access_token', t); }
        function clearToken() { localStorage.removeItem('access_token'); }
        function isLoggedIn() { return !!getToken(); }

        function logout() {
            localStorage.clear();
            window.location.href = '/staff/login/';
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
