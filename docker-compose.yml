      - ./services/watch_service:/app
      - ./shared:/shared
    command: python manage.py runserver 0.0.0.0:8000

  shoe-service:
    build:
      context: .
      dockerfile: services/shoe_service/Dockerfile
    container_name: shoe-service
    environment:
      - DATABASE_URL=postgresql://shoe_user:shoe_pass@shoe_db:5432/shoe_db
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    ports:
      - "8029:8000"
    depends_on:
      - shoe_db
      - rabbitmq
    networks:
      - microservices_network
    volumes:
      - ./services/shoe_service:/app
      - ./shared:/shared
    command: python manage.py runserver 0.0.0.0:8000

  furniture-service:
    build:
      context: .
      dockerfile: services/furniture_service/Dockerfile
    container_name: furniture-service
    environment:
      - DATABASE_URL=postgresql://furniture_user:furniture_pass@furniture_db:5432/furniture_db
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    ports:
      - "8030:8000"
    depends_on:
      - furniture_db
      - rabbitmq
    networks:
      - microservices_network
    volumes:
      - ./services/furniture_service:/app
      - ./shared:/shared
    command: python manage.py runserver 0.0.0.0:8000


  # Background Workers
  auth-publisher:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: auth-publisher
    volumes:
      - ./services/auth_service:/app
      - ./shared:/shared
    environment:
      - PYTHONPATH=/app:/shared
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - DATABASE_URL=postgresql://auth_user:auth_pass@auth_db:5432/auth_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - microservices_network
    command: python publisher.py

  customer-consumer:
    build:
      context: .
      dockerfile: services/customer_service/Dockerfile
    container_name: customer-consumer
    volumes:
      - ./services/customer_service:/app
      - ./shared:/shared
    environment:
      - PYTHONPATH=/app:/shared
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
      - DATABASE_URL=postgresql://customer_user:customer_pass@customer_db:5432/customer_db
    depends_on:
      rabbitmq:
        condition: service_healthy
      customer-service:
        condition: service_started
    networks:
      - microservices_network
    command: python consumer.py
  
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - microservices_network

  # Recommendation Service (AI)
  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation_service/Dockerfile
    container_name: recommendation-service
    environment:
      - TRACKING_SERVICE_URL=http://api-gateway:8000/api/tracking/
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8101:8001"
    depends_on:
      - qdrant
    networks:
      - microservices_network
    volumes:
      - ./services/recommendation_service:/app

  # Vector Service (Manual Sync)
  vector-service:
    profiles: ["manual"]
    build:
      context: .
      dockerfile: services/vector_service/Dockerfile
    container_name: vector-service
    environment:
      - PRODUCT_SERVICE_URL=http://api-gateway:8000/api/products/
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    networks:
      - microservices_network

